<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17213b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CryptoChat" />
  <meta name="description" content="Ende-til-ende-kryptert chat" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CryptoChat</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/img/icon-192.png" />
  <style>
/* Critical CSS - loads first for instant paint */
:root{--c-bg:#0e1621;--c-card:#17213b;--c-text:#e7e8f3;--c-text-muted:#6d8094;--c-border:#1c2436;--c-primary:#3390ec}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--c-bg);color:var(--c-text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',sans-serif;overflow:hidden;height:100vh}.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px}.loading-inner{text-align:center}.loading-icon{font-size:3rem}.loading-brand{font-size:1.3rem;font-weight:700;color:var(--c-text);margin-top:8px}.loading-label{font-size:.85rem;color:var(--c-text-muted)}
</style>
  <link rel="stylesheet" href="/static/css/style.css?v={{ version or '17' }}" />
</head>
<body data-username="{{ username }}">
  <div id="app" class="app">
    <div class="loading-screen">
      <div class="loading-inner">
        <div class="loading-icon">🔐</div>
        <div class="loading-brand">CryptoChat</div>
        <div class="loading-label">Laster...</div>
      </div>
    </div>
  </div>
  <div id="installBanner" class="install-banner">
    <span id="installBannerLabel" class="install-banner-label">Installer CryptoChat</span>
    <div class="install-banner-actions">
      <button id="installAcceptBtn" class="btn btn-primary btn-small">Installer</button>
      <button id="installDismissBtn" class="btn btn-ghost btn-small">Avvis</button>
    </div>
  </div>

  <script src="/static/js/bootstrap.js?v={{ version or '17' }}"></script>
  <script src="/static/js/crypto.js?v={{ version or '17' }}" defer></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous" async></script>
  <script src="/static/js/socket.js?v={{ version or '17' }}"></script>
  <script src="/static/js/chat.js?v={{ version or '17' }}" defer></script>
</body>
</html>
