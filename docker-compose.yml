services:
  cryptochat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - cryptochat-data:/app/data
    environment:
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - FLASK_ENV=production
      - SESSION_COOKIE_SECURE=true
      - CSRF_ENABLED=true
      - CSRF_TRUSTED_ORIGINS=https://raspberrypi5.tail686286.ts.net
    secrets:
      - secret_key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cryptochat-data:

secrets:
  secret_key:
    file: ./secrets/secret_key
